metadata:
  title: "AI Ecosystem Canonical Governance, Economic & Architecture Model"
  version: "2.4"
  description: "Single-source-of-truth property graph integrating cognitive agent state (CoALA), cybernetic control (VSM), macro-economics (a16z/Sequoia), and regulatory liability (NIST/EU AI Act)."

styles:
  shapes:
    hexagon:
      label: "Statutory & Regulatory Authority"
      description: "External legal jurisdictions, court systems, conformity auditors (non-negotiable authority)."
    circle:
      label: "Human Actor / Natural Person"
      description: "Human principals, operators (HITL), or impacted third-party individuals."
    subproc:
      label: "Deterministic Gateway & Policy Kernel"
      description: "Sandboxes, policy harnesses, capability gateways where deterministic logic bounds AI."
    cylinder:
      label: "Stateful Store & Critical Data Asset"
      description: "Append-only audit stores, vector databases, production databases, target ERPs."
    stadium:
      label: "Identity & Security Issuer"
      description: "Enterprise IdP, OAuth token issuers, workload authorization brokers."
    rounded:
      label: "Software Service & Inference API"
      description: "Frontier model endpoints, vertical applications, continuous eval engines."
    rect:
      label: "Organizational & Economic Entity"
      description: "Commercial deployers, CapEx supply chain entities, market absorption zones."

  edge_types:
    money:
      syntax: "== 'label' ==>"
      label: "Capital / Commercial Flow"
      description: "Financial transactions, SaaS subscriptions, compute CapEx, insurance premiums."
    authority:
      syntax: "== 'label' ==>"
      label: "Direct Authority & Override"
      description: "Statutory mandates, legal agency delegation, mandatory human oversight."
    governance_control:
      syntax: "-. 'label' .->"
      label: "Policy Constraint & Audit Trail"
      description: "Tamper-evident logging, scope enforcement, sandbox boundaries."
    tension:
      syntax: "-. 'label' .->"
      label: "Liability & Market Tension"
      description: "Tort liability exposure, blast radius impact, platform commoditization pressure."
    disclaim:
      syntax: "-. 'label' .->"
      label: "Contractual Disclaimer"
      description: "ToS liability carve-outs and 'AS-IS' warranty limitations."
    protocol:
      syntax: "-->|'label'|"
      label: "Technical Protocol"
      description: "JSON-RPC tool calling, OAuth bearer flows, inference API calls, A2A delegation."
    flow:
      syntax: "-->|'label'|"
      label: "Data & Intent Flow"
      description: "Prompt context, telemetry metrics, audit evidence submissions."

taxonomies:
  domains: [economic, technical, governance]
  eu_ai_act_roles: [Provider_GPAI, Provider_System, Deployer, Importer, Distributor, Affected_Subject]
  liability_types: [Strict, Vicarious, Contractual_Capped, Disclaimed]
  cardinality_scale: [Global_Oligopoly_10_1, Replicated_Inference_10_3, Domain_ISVs_10_5, Ephemeral_Agents_10_8]
  protocol_planes:
    A2E: "Agent-to-Enterprise (Identity, Auth, Entitlements)"
    MIP: "Model Inference Protocol (Token generation, directives)"
    A2T: "Agent-to-Tool / Context (MCP, Function Calling)"
    A2A: "Agent-to-Agent (Distributed delegation, negotiation)"
  vsm_subsystems: [System_1_Operations, System_2_Coordination, System_3_Control_Audit, System_4_Intelligence, System_5_Policy]
  nist_rmf_functions: [GOVERN, MAP, MEASURE, MANAGE]
  coala_memory_types: [Working_Memory, Semantic_Memory, Episodic_Memory, Procedural_Rules]

clusters:
  - id: cluster_regulatory
    label: "0. Jurisdictional & Regulatory Sphere"
  - id: cluster_supply
    label: "1. Upstream Foundation & Model Lab"
  - id: cluster_product
    label: "2. Specialized Product & Harness Domain (ISV / Custom Runtime)"
  - id: cluster_client
    label: "3. Enterprise Deployer & Principal Domain"
  - id: cluster_environment
    label: "4. Target Execution Environment & Blast Radius"

nodes:
  # ===================================================================
  # Cluster 0: Regulatory & Oversight
  # ===================================================================
  - id: N_REGULATOR
    label: "Market Surveillance Authorities"
    sublabel: "EU AI Office, FTC, DPAs, Courts"
    cluster: cluster_regulatory
    domains: [governance]
    shape: hexagon
    properties:
      cardinality: "10^1 Jurisdictional Bodies"
      enforcement_powers: "Fines up to 7% global turnover, stop orders"
      vsm_tier: "System 5 (External Statutory Meta-System)"
      nist_function: "GOVERN"

  - id: N_AUDITOR
    label: "Conformity Body & ISO Auditor"
    sublabel: "Notified Bodies, ISO/IEC 42001 Certifiers"
    cluster: cluster_regulatory
    domains: [governance]
    shape: hexagon
    properties:
      cardinality: "10^2 Accredited Audit Entities"
      role: "CE conformity assessments & continuous surveillance"
      vsm_tier: "System 3* (Sporadic External Audit)"
      nist_function: "MEASURE"

  - id: N_INSURER
    label: "AI Risk Underwriter & Insurer"
    sublabel: "Algorithmic Liability & Cyber Risk Carrier"
    cluster: cluster_regulatory
    domains: [economic, governance]
    shape: rect
    properties:
      cardinality: "10^2 Global Underwriters"
      underwriting_gate: "Requires verifiable audit trail & human oversight"
      vsm_tier: "System 3 (Economic Viability Gate)"
      nist_function: "MANAGE"

  # ===================================================================
  # Cluster 1: Upstream Foundation & Model Lab
  # ===================================================================
  - id: N_TRAIN
    label: "Training Supply Chain"
    sublabel: "Data Curators, Annotators, Mega-Compute Hubs"
    cluster: cluster_supply
    domains: [economic, technical]
    shape: rect
    properties:
      cardinality: "Top 5-10 Global Mega-Campuses"
      compute_profile: "Concentrated 50k-100k+ GPU clusters; GW-scale power"
      cost_type: "Fixed / Heavy CapEx ($600B Infrastructure Question)"
      ip_risk: "Copyright infringement / scraping litigation"
      vsm_tier: "System 1 (Upstream Production)"
      nist_function: "MAP"

  - id: N_FRONTIER
    label: "Frontier Foundation Model"
    sublabel: "Globally Replicated Weights & Inference Fleets"
    cluster: cluster_supply
    domains: [economic, technical, governance]
    shape: rounded
    properties:
      cardinality: "Top 5-10 Labs; Replicated across 10^3 Regional Clusters"
      compute_profile: "High memory-bandwidth inference clusters; low latency"
      sovereignty_gap: "Physical data residency does not equal jurisdictional independence"
      eu_ai_act_role: "Provider_GPAI"
      pricing_model: "Wholesale Per-Token Usage"
      liability_posture: "Disclaimed via ToS ('AS-IS')"
      vsm_tier: "System 4 (Probabilistic Intelligence Engine)"
      nist_function: "MEASURE"

  - id: N_ABSORBED
    label: "Platform Absorption Zone"
    sublabel: "Native Tools, Prompt Cache, Hosted State"
    cluster: cluster_supply
    domains: [economic, technical]
    shape: rect
    properties:
      cardinality: "Top 3-5 Cloud Ecosystems"
      market_effect: "Feature commoditization of wrapper ISVs (a16z Stack)"
      vsm_tier: "System 4 (Environmental Encroachment)"

  # ===================================================================
  # Cluster 2: Specialized Product & Harness Domain (ISV / Custom)
  # ===================================================================
  - id: N_ISV_PRODUCT
    label: "Specialized AI Application"
    sublabel: "Vertical Solutions (Legal, Medical, Finance, Ops)"
    cluster: cluster_product
    domains: [economic, technical]
    shape: rounded
    properties:
      cardinality: "10^4 - 10^5 Vertical SaaS Products"
      eu_ai_act_role: "Provider_System"
      pricing_model: "Per-Seat SaaS / Value-Added Outcome Fee"
      margin_exposure: "Squeezed between token costs & platform absorption"
      vsm_tier: "System 4 (Operational Domain Intelligence)"
      nist_function: "MAP"

  - id: N_HARNESS
    label: "Agent Governance Harness"
    sublabel: "Deterministic Policy Engine & Guardrails"
    cluster: cluster_product
    domains: [technical, governance]
    shape: subproc
    properties:
      cardinality: "10^7 - 10^9 Ephemeral Agent Invocations"
      compute_profile: "Lightweight CPU / Orchestration Logic"
      iso_42001_role: "AIMS Technical Control Implementation"
      duty_of_care: "Caps blast radius, halts unsafe prompts/actions"
      coala_role: "Action Execution Engine & Procedural Memory Guard"
      anthropic_pattern: "Decoupled Orchestrator-Worker & Gate"
      vsm_tier: "System 3 (Internal Operational Control & Stability)"
      nist_function: "MANAGE"

  - id: N_AUDIT_STORE
    label: "Sovereign Audit Ledger"
    sublabel: "Tamper-Evident WORM State & Forensic Store"
    cluster: cluster_product
    domains: [technical, governance]
    shape: cylinder
    properties:
      cardinality: "10^4 Enterprise Sovereign Ledgers"
      compliance: "Art. 12 Mandatory Logging / Rebuttal of Fault"
      sovereignty: "Client / Enterprise Owned"
      evidentiary_role: "Black-Box Flight Recorder for Liability Disputes"
      vsm_tier: "System 3* (Internal Audit Channel)"
      nist_function: "MEASURE"

  - id: N_OBSERVE
    label: "Observability & Evals Engine"
    sublabel: "Continuous Evaluation, Traces & Cost Telemetry"
    cluster: cluster_product
    domains: [technical, governance, economic]
    shape: rounded
    properties:
      cardinality: "10^4 Monitoring Pipelines"
      capabilities: "LLM-as-a-judge, OTEL tracing, token telemetry"
      vsm_tier: "System 3 (Performance Monitoring & Homeostasis)"
      nist_function: "MEASURE"

  # ===================================================================
  # Cluster 3: Enterprise Deployer & Principal Domain
  # ===================================================================
  - id: N_ENTERPRISE
    label: "Enterprise Deployer"
    sublabel: "Legal Principal & Economic Sponsor"
    cluster: cluster_client
    domains: [economic, governance]
    shape: rect
    properties:
      cardinality: "10^5 Commercial Deployers Globally"
      eu_ai_act_role: "Deployer"
      liability_posture: "Holds Vicarious & Strict Legal Liability"
      roi_hurdle: "High CapEx Recovery Pressure (Sequoia Act Two)"
      vsm_tier: "System 5 (Corporate Policy & Ultimate Governance)"
      nist_function: "GOVERN"

  - id: N_IDP
    label: "Enterprise Identity & Auth (IdP)"
    sublabel: "OAuth, OIDC, Workload IAM & Ephemeral Tokens"
    cluster: cluster_client
    domains: [technical, governance]
    shape: stadium
    properties:
      cardinality: "10^5 Enterprise Directories"
      security_role: "Issues scoped actor delegations to agents (A2E)"
      vsm_tier: "System 2 (Security Coordination)"
      nist_function: "MANAGE"

  - id: N_KNOWLEDGE_STORE
    label: "Enterprise Semantic Knowledge Base"
    sublabel: "Proprietary Vector DBs, Documents & Embeddings"
    cluster: cluster_client
    domains: [technical, governance]
    shape: cylinder
    properties:
      cardinality: "10^5 Private Knowledge Bases"
      coala_memory_type: "Semantic Memory (Factual & Document Knowledge)"
      sovereignty: "Enterprise Controlled / Private Boundary"
      vsm_tier: "System 1 (Knowledge Asset)"
      nist_function: "MAP"

  - id: N_HUMAN_USER
    label: "Human Task Delegator & Overseer"
    sublabel: "End User / Mandatory HITL Supervisor"
    cluster: cluster_client
    domains: [technical, governance]
    shape: circle
    properties:
      cardinality: "10^8 End Users & Operators"
      control_mode: "Prompting, Art. 14 Human Oversight, Override"
      vsm_tier: "System 5 (Human Intent & Final Agency)"
      nist_function: "GOVERN"

  # ===================================================================
  # Cluster 4: Target Execution Environment & Blast Radius
  # ===================================================================
  - id: N_TOOL_GATEWAY
    label: "Capability & Tool Gateway"
    sublabel: "Decoupled Tool Broker & Context Provider (MCP)"
    cluster: cluster_environment
    domains: [technical, governance]
    shape: subproc
    properties:
      cardinality: "10^4 - 10^5 Gateway Servers"
      protocol_standards: "Model Context Protocol (MCP), OpenAPI, GraphQL (A2T)"
      security_role: "Tool discovery, sandbox isolation, scope negotiation"
      vsm_tier: "System 2 (Coordination & Oscillation Damping)"
      nist_function: "MANAGE"

  - id: N_TARGET_SYS
    label: "Target Systems & Operational APIs"
    sublabel: "Databases, Production ERP, Financial Rails"
    cluster: cluster_environment
    domains: [technical, governance]
    shape: cylinder
    properties:
      cardinality: "10^6 Production Systems Globally"
      risk_zone: "Direct Causation Blast Radius"
      vsm_tier: "System 1 (Real-World Actuation & Operations)"
      nist_function: "MANAGE"

  - id: N_AFFECTED_PARTY
    label: "Impacted Third Party"
    sublabel: "Consumers, Employees, Citizens"
    cluster: cluster_environment
    domains: [governance]
    shape: circle
    properties:
      cardinality: "Billions of Impacted Individuals"
      eu_ai_act_role: "Affected_Subject"
      legal_standing: "Private Right of Action, Tort Plaintiff, Data Subject"
      vsm_tier: "External Environment (Ultimate Impact Receptor)"

# ===================================================================
# Relationships & Edges (Fully Audited Source & Target IDs)
# ===================================================================
edges:
  # ==========================================
  # 1. Economic Edges (Capital & Value Flows)
  # ==========================================
  - from: N_ENTERPRISE
    to: N_ISV_PRODUCT
    label: "$$$ SaaS Subscription / Outcome Fee"
    domains: [economic]
    type: money

  - from: N_ISV_PRODUCT
    to: N_FRONTIER
    label: "$$ Wholesale Token Consumption Cost"
    domains: [economic]
    type: money

  - from: N_FRONTIER
    to: N_TRAIN
    label: "$ Compute CapEx & Annotation"
    domains: [economic]
    type: money

  - from: N_ABSORBED
    to: N_ISV_PRODUCT
    label: "Platform Commoditization Pressure (a16z Stack)"
    domains: [economic]
    type: tension

  - from: N_INSURER
    to: N_ENTERPRISE
    label: "$ Policy Premiums & Underwriting"
    domains: [economic, governance]
    type: money

  - from: N_OBSERVE
    to: N_ENTERPRISE
    label: "Real-time Cost & Token Telemetry"
    domains: [economic, technical]
    type: flow

  # ==========================================
  # 2. Governance, Regulatory & Liability Edges
  # ==========================================
  - from: N_REGULATOR
    to: N_ENTERPRISE
    label: "Statutory Compliance & Fines (Art. 71)"
    domains: [governance]
    type: authority

  - from: N_REGULATOR
    to: N_FRONTIER
    label: "GPAI Codes of Practice & Transparency (Art. 53)"
    domains: [governance]
    type: authority

  - from: N_AUDITOR
    to: N_ENTERPRISE
    label: "Conformity Audits (ISO 42001 / High Risk)"
    domains: [governance]
    type: authority

  - from: N_FRONTIER
    to: N_ENTERPRISE
    label: "Disclaims Liability (ToS 'AS-IS' / Ada Lovelace Gap)"
    domains: [governance]
    type: disclaim

  - from: N_ENTERPRISE
    to: N_AFFECTED_PARTY
    label: "Vicarious Liability for Agent Harm (Respondeat Superior)"
    domains: [governance]
    type: tension

  - from: N_AFFECTED_PARTY
    to: N_REGULATOR
    label: "Complaints & Redress Demands"
    domains: [governance]
    type: flow

  - from: N_ENTERPRISE
    to: N_HARNESS
    label: "Delegates Authority & Safety Boundaries (VSM 5 to 3)"
    domains: [governance]
    type: authority

  - from: N_HUMAN_USER
    to: N_HARNESS
    label: "Art. 14 Human Oversight & Stop Button"
    domains: [governance]
    type: authority

  - from: N_HARNESS
    to: N_AUDIT_STORE
    label: "Cryptographic Tamper-Proof Audit Trail (Art. 12)"
    domains: [governance, technical]
    type: governance_control

  - from: N_AUDIT_STORE
    to: N_AUDITOR
    label: "Forensic Evidence for Compliance Verification"
    domains: [governance]
    type: flow

  - from: N_HARNESS
    to: N_TOOL_GATEWAY
    label: "Enforces Least-Privilege Scopes (VSM 3 to 2)"
    domains: [governance, technical]
    type: governance_control

  - from: N_TARGET_SYS
    to: N_AFFECTED_PARTY
    label: "Direct Impact & Real-World Blast Radius"
    domains: [governance, technical]
    type: tension

  # ==========================================
  # 3. Technical & Protocol Edges (The 4 Protocol Planes)
  # ==========================================
  - from: N_HUMAN_USER
    to: N_ISV_PRODUCT
    label: "Prompt Intent & Working Context"
    domains: [technical]
    type: flow

  - from: N_IDP
    to: N_HARNESS
    label: "A2E Workload Identity Delegation (OAuth/OIDC)"
    domains: [technical]
    type: protocol

  - from: N_ISV_PRODUCT
    to: N_HARNESS
    label: "Initiates Autonomous Loop"
    domains: [technical]
    type: flow

  - from: N_HARNESS
    to: N_FRONTIER
    label: "MIP Inference API (Tokens & Directives)"
    domains: [technical]
    type: protocol

  - from: N_HARNESS
    to: N_KNOWLEDGE_STORE
    label: "RAG Semantic Retrieval & Working Context (CoALA)"
    domains: [technical]
    type: flow

  - from: N_HARNESS
    to: N_HARNESS
    label: "A2A Multi-Agent Delegation & Peer Protocol"
    domains: [technical]
    type: protocol

  - from: N_HARNESS
    to: N_OBSERVE
    label: "Traces & LLM Evaluation Metrics"
    domains: [technical]
    type: flow

  - from: N_HARNESS
    to: N_TOOL_GATEWAY
    label: "A2T Tool Calling & Context Protocol (MCP / OpenAPI)"
    domains: [technical]
    type: protocol

  - from: N_TOOL_GATEWAY
    to: N_TARGET_SYS
    label: "Authenticated Operations Execution (VSM System 1)"
    domains: [technical]
    type: flow

# ===================================================================
# Multi-Lens Views
# ===================================================================
views:
  - id: view_economic
    title: "Executive & Economic Perspective"
    description: "Capital allocation, SaaS margins, token cost exposure, and platform absorption (a16z & Sequoia Stack)."
    domains: [economic]
    direction: "TB"

  - id: view_governance_liability
    title: "Legal, Regulatory & Liability Perspective"
    description: "The liability disconnect: upstream ToS disclaimers vs deployer vicarious liability and regulatory enforcement (Ada Lovelace & EU AI Act)."
    domains: [governance]
    direction: "TB"

  - id: view_technical_runtime
    title: "Engineering & Technical Runtime Perspective"
    description: "The agentic execution loop: A2E IdP delegation, MIP inference, CoALA semantic RAG, A2A delegation, and A2T capability gateways."
    domains: [technical]
    direction: "LR"

  - id: view_full_unified
    title: "Unified Ecosystem Model"
    description: "The complete property graph combining economic flows, technical loops, and cybernetic governance gates (VSM Systems 1–5)."
    domains: [economic, technical, governance]
    direction: "TB"