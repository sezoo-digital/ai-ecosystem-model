metadata:
  title: "AI Ecosystem Canonical Governance, Economic & Architecture Model"
  version: "2.2"
  description: "Single-source-of-truth property graph capturing economic flows, technical protocols, legal agency, and liability boundaries across the AI value chain."

taxonomies:
  domains: [economic, technical, governance]
  eu_ai_act_roles: [Provider_GPAI, Provider_System, Deployer, Importer, Distributor, Affected_Subject]
  liability_types: [Strict, Vicarious, Contractual_Capped, Disclaimed]

clusters:
  - id: cluster_regulatory
    label: "0. Jurisdictional & Regulatory Sphere"
  - id: cluster_supply
    label: "1. Upstream Foundation & Model Lab"
  - id: cluster_product
    label: "2. Specialized Product & Harness Domain (ISV / Custom Runtime)"
  - id: cluster_client
    label: "3. Enterprise Deployer & Principal Domain"
  - id: cluster_environment
    label: "4. Target Execution Environment & Blast Radius"

nodes:
  # --- Cluster 0: Regulatory & Oversight ---
  - id: N_REGULATOR
    label: "Market Surveillance Authorities"
    sublabel: "EU AI Office, FTC, DPAs, Courts"
    cluster: cluster_regulatory
    domains: [governance]
    shape: hexagon
    properties:
      enforcement_powers: "Fines up to 7% turnover, injunctions"

  - id: N_AUDITOR
    label: "Conformity Body & ISO Auditor"
    sublabel: "Notified Bodies, ISO/IEC 42001 Certifiers"
    cluster: cluster_regulatory
    domains: [governance]
    shape: hexagon
    properties:
      role: "AIMS certification & post-market monitoring"

  - id: N_INSURER
    label: "AI Risk Underwriter & Insurer"
    sublabel: "Cyber & Algorithmic Liability Carrier"
    cluster: cluster_regulatory
    domains: [economic, governance]
    shape: rect
    properties:
      underwriting_gate: "Requires verifiable audit trail & human oversight"

  # --- Cluster 1: Upstream Supply Chain ---
  - id: N_TRAIN
    label: "Training Supply Chain"
    sublabel: "Data Curators, Annotators, Compute Clusters"
    cluster: cluster_supply
    domains: [economic, technical]
    shape: rect
    properties:
      cost_type: "Fixed / Heavy R&D CapEx"
      ip_risk: "Copyright / Scraping litigation"

  - id: N_FRONTIER
    label: "Frontier GPAI Lab"
    sublabel: "Weights & Wholesale Inference APIs"
    cluster: cluster_supply
    domains: [economic, technical, governance]
    shape: rounded
    properties:
      eu_ai_act_role: "Provider_GPAI"
      pricing_model: "Per-Token Usage"
      liability_posture: "Disclaimed via ToS ('AS-IS')"

  - id: N_ABSORBED
    label: "Platform Absorption Zone"
    sublabel: "Native Tools, Prompt Cache, Hosted Agent State"
    cluster: cluster_supply
    domains: [economic, technical]
    shape: rect
    properties:
      market_effect: "Feature commoditization of wrapper ISVs"

  # --- Cluster 2: Product & Agent Harness ---
  - id: N_ISV_PRODUCT
    label: "Specialized AI Application"
    sublabel: "Vertical Solutions (Legal, Medical, Finance, Ops)"
    cluster: cluster_product
    domains: [economic, technical]
    shape: rounded
    properties:
      eu_ai_act_role: "Provider_System"
      pricing_model: "SaaS Seat / Value Outcome"

  - id: N_HARNESS
    label: "Agent Governance Harness"
    sublabel: "Deterministic Policy Engine & Guardrails"
    cluster: cluster_product
    domains: [technical, governance]
    shape: subproc
    properties:
      iso_42001_role: "AIMS Technical Control Implementation"
      duty_of_care: "Caps blast radius, halts unsafe prompts/actions"

  - id: N_AUDIT_STORE
    label: "Sovereign Audit Ledger"
    sublabel: "Tamper-Evident WORM State & Forensic Store"
    cluster: cluster_product
    domains: [technical, governance]
    shape: cylinder
    properties:
      compliance: "Art. 12 Mandatory Logging / Rebuttal of Fault"
      sovereignty: "Client / Enterprise Owned"

  - id: N_OBSERVE
    label: "Observability & Evals Engine"
    sublabel: "Continuous Evaluation, Traces & Cost Telemetry"
    cluster: cluster_product
    domains: [technical, governance, economic]
    shape: rounded
    properties:
      capabilities: "LLM-as-a-judge, OTEL tracing, token cost tracking"

  # --- Cluster 3: Enterprise Client & Principal ---
  - id: N_ENTERPRISE
    label: "Enterprise Deployer"
    sublabel: "Legal Principal & Economic Sponsor"
    cluster: cluster_client
    domains: [economic, governance]
    shape: rect
    properties:
      eu_ai_act_role: "Deployer"
      liability_posture: "Holds Vicarious & Strict Liability"

  - id: N_IDP
    label: "Enterprise Identity & Auth (IdP)"
    sublabel: "OAuth, OIDC, Workload IAM & Ephemeral Tokens"
    cluster: cluster_client
    domains: [technical, governance]
    shape: stadium
    properties:
      security_role: "Issues scoped actor delegations to agents"

  - id: N_HUMAN_USER
    label: "Human Task Delegator & Overseer"
    sublabel: "End User / Mandatory HITL Supervisor"
    cluster: cluster_client
    domains: [technical, governance]
    shape: circle
    properties:
      control_mode: "Prompting, Art. 14 Human Oversight, Override"

  # --- Cluster 4: Environment & Blast Radius ---
  - id: N_MCP_HOST
    label: "Protocol Gateway (MCP Host)"
    sublabel: "Standardized Tool Broker & Context Provider"
    cluster: cluster_environment
    domains: [technical, governance]
    shape: subproc
    properties:
      protocol_standard: "Model Context Protocol (MCP)"
      isolation: "Dynamic capability & permission negotiation"

  - id: N_TARGET_SYS
    label: "Target Systems & Operational APIs"
    sublabel: "Databases, Production ERP, Financial Rails"
    cluster: cluster_environment
    domains: [technical, governance]
    shape: cylinder
    properties:
      risk_zone: "Direct Causation Blast Radius"

  - id: N_AFFECTED_PARTY
    label: "Impacted Third Party"
    sublabel: "Consumers, Employees, Citizens"
    cluster: cluster_environment
    domains: [governance]
    shape: circle
    properties:
      eu_ai_act_role: "Affected_Subject"
      legal_standing: "Private right of action, tort claimant"

edges:
  # ==========================================
  # Economic Edges
  # ==========================================
  - from: N_ENTERPRISE
    to: N_ISV_PRODUCT
    label: "$$$ SaaS Subscription / Outcome Fee"
    domains: [economic]
    type: money

  - from: N_ISV_PRODUCT
    to: N_FRONTIER
    label: "$$ Token Consumption Cost"
    domains: [economic]
    type: money

  - from: N_FRONTIER
    to: N_TRAIN
    label: "$ Compute & Data CapEx"
    domains: [economic]
    type: money

  - from: N_ABSORBED
    to: N_ISV_PRODUCT
    label: "Platform Commoditization Pressure"
    domains: [economic]
    type: tension

  - from: N_INSURER
    to: N_ENTERPRISE
    label: "$ Policy Premiums & Underwriting"
    domains: [economic, governance]
    type: money

  - from: N_OBSERVE
    to: N_ENTERPRISE
    label: "Real-time Cost & Token Telemetry"
    domains: [economic, technical]
    type: flow

  # ==========================================
  # Governance, Regulatory & Liability Edges
  # ==========================================
  - from: N_REGULATOR
    to: N_ENTERPRISE
    label: "Statutory Compliance & Fines (Art. 71)"
    domains: [governance]
    type: authority

  - from: N_REGULATOR
    to: N_FRONTIER
    label: "GPAI Codes of Practice & Transparency (Art. 53)"
    domains: [governance]
    type: authority

  - from: N_AUDITOR
    to: N_ENTERPRISE
    label: "Conformity Audits (ISO 42001 / High Risk)"
    domains: [governance]
    type: authority

  - from: N_FRONTIER
    to: N_ENTERPRISE
    label: "Disclaims Liability (ToS 'AS-IS')"
    domains: [governance]
    type: disclaim

  - from: N_ENTERPRISE
    to: N_AFFECTED_PARTY
    label: "Vicarious Liability for Agent Harm (Respondeat Superior)"
    domains: [governance]
    type: tension

  - from: N_AFFECTED_PARTY
    to: N_REGULATOR
    label: "Complaints & Redress Demands"
    domains: [governance]
    type: flow

  - from: N_ENTERPRISE
    to: N_HARNESS
    label: "Delegates Authority & Safety Boundaries"
    domains: [governance]
    type: authority

  - from: N_HUMAN_USER
    to: N_HARNESS
    label: "Art. 14 Human Oversight & Stop Button"
    domains: [governance]
    type: authority

  - from: N_HARNESS
    to: N_AUDIT_STORE
    label: "Cryptographic Tamper-Proof Audit Trail"
    domains: [governance, technical]
    type: governance_control

  - from: N_AUDIT_STORE
    to: N_AUDITOR
    label: "Forensic Evidence for Compliance Verification"
    domains: [governance]
    type: flow

  - from: N_HARNESS
    to: N_MCP_HOST
    label: "Enforces Least-Privilege Scopes"
    domains: [governance, technical]
    type: governance_control

  - from: N_TARGET_SYS
    to: N_AFFECTED_PARTY
    label: "Direct Impact & Real-World Blast Radius"
    domains: [governance, technical]
    type: tension

  # ==========================================
  # Technical & Protocol Edges
  # ==========================================
  - from: N_HUMAN_USER
    to: N_ISV_PRODUCT
    label: "Prompt Intent & Working Context"
    domains: [technical]
    type: flow

  - from: N_IDP
    to: N_HARNESS
    label: "Issues Scoped Delegation Token"
    domains: [technical]
    type: protocol

  - from: N_ISV_PRODUCT
    to: N_HARNESS
    label: "Initiates Autonomous Loop"
    domains: [technical]
    type: flow

  - from: N_HARNESS
    to: N_FRONTIER
    label: "Inference API (Tokens & Directives)"
    domains: [technical]
    type: protocol

  - from: N_HARNESS
    to: N_AUDIT_STORE
    label: "Context Retrieval (RAG) & Checkpointing"
    domains: [technical]
    type: flow

  - from: N_HARNESS
    to: N_OBSERVE
    label: "Traces & LLM Evaluation Metrics"
    domains: [technical]
    type: flow

  - from: N_HARNESS
    to: N_MCP_HOST
    label: "JSON-RPC / MCP Tool Discovery & Invocations"
    domains: [technical]
    type: protocol

  - from: N_MCP_HOST
    to: N_TARGET_SYS
    label: "Authenticated Read/Write Operations"
    domains: [technical]
    type: flow

views:
  - id: view_economic
    title: "Executive & Economic Perspective"
    description: "Capital allocation, SaaS margins, token cost exposure, and platform absorption."
    domains: [economic]
    direction: "TB"

  - id: view_governance_liability
    title: "Legal, Regulatory & Liability Perspective"
    description: "The liability disconnect: upstream ToS disclaimers vs deployer vicarious liability and regulatory enforcement."
    domains: [governance]
    direction: "TB"

  - id: view_technical_runtime
    title: "Engineering & Technical Runtime Perspective"
    description: "The agentic execution loop: IdP delegation, inference protocols, MCP gateways, and state stores."
    domains: [technical]
    direction: "LR"

  - id: view_full_unified
    title: "Unified Ecosystem Model"
    description: "The complete property graph combining economic flows, technical loops, and governance gates."
    domains: [economic, technical, governance]
    direction: "TB"