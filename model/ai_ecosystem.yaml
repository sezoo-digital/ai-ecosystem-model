# yaml-language-server: $schema=../schema/ai_ecosystem.json
metadata:
  title: "AI Ecosystem Canonical Governance, Economic & Architecture Model"
  version: "2.9"
  description: "Single-source-of-truth property graph integrating cognitive agent state (CoALA), cybernetic control (Beer's VSM Systems 1-5), standards bodies, safety institutes, physical semiconductor chokepoints, energy constraints, and market power asymmetry."

clusters:
  - id: cluster_regulatory
    label: "0. Jurisdictional, Capital & Regulatory Sphere"
    description: "Statutory authorities, standards bodies, national safety institutes, underwriting insurers, and macro capital markets."
  - id: cluster_supply
    label: "1. Upstream Foundation, Silicon & Energy Supply"
    description: "Semiconductor lithography, energy grids, training mega-compute hubs, frontier labs, open commons, and platform absorption."
  - id: cluster_product
    label: "2. Specialized Product & Harness Domain (ISV / Custom Runtime)"
    description: "Vertical AI applications, continuous observability/evals, and autonomous runtime harnesses."
  - id: cluster_client
    label: "3. Enterprise Deployer & Principal Domain"
    description: "Enterprise principals, corporate IAM/IdP directories, private knowledge bases, and human overseers."
  - id: cluster_environment
    label: "4. Target Execution Environment & Blast Radius"
    description: "Decoupled capability gateways, target production systems, and impacted external third parties."

nodes:
  # ===================================================================
  # Cluster 0: Regulatory & Oversight (Recursion Level n+1: Meta-System)
  # ===================================================================
  - id: N_REGULATOR
    label: "Market Surveillance & Trade Authorities"
    sublabel: "EU AI Office, FTC, BIS Export Controls, DPAs, Courts"
    cluster: cluster_regulatory
    domains: [governance]
    kind: StatutoryAuthority
    vsm_system: S5_Policy
    vsm_recursion_level: Level_n_plus_1_Jurisdiction
    jurisdiction: Multi_Jurisdictional
    eu_ai_act_role: Not_Applicable
    nist_function: GOVERN
    cardinality_log10_min: 1.0
    cardinality_log10_max: 2.0
    cardinality_unit: jurisdictions
    properties:
      enforcement_powers: "Fines up to 7% global turnover (Art. 99), export control sanctions, stop orders"

  - id: N_STANDARDS_BODY
    label: "Standards Setting Organizations"
    sublabel: "ISO/IEC JTC 1/SC 42, NIST, CEN-CENELEC, IEEE"
    cluster: cluster_regulatory
    domains: [governance, technical]
    kind: StandardsConsortium
    vsm_system: S2_Coordination
    vsm_recursion_level: Level_n_plus_1_Jurisdiction
    jurisdiction: Global
    eu_ai_act_role: Not_Applicable
    nist_function: MAP
    cardinality_log10_min: 1.0
    cardinality_log10_max: 1.5
    cardinality_unit: entities
    properties:
      harmonization_role: "Defines CEN-CENELEC harmonised European standards (hENs) and ISO/IEC 42001 AIMS controls"
      variety_function: "Attenuates technical variety into standardized conformity benchmarks"

  - id: N_SAFETY_INSTITUTE
    label: "AI Safety & Horizon Institutes"
    sublabel: "US AISI, UK AISI, Japan AISI, Frontier Evaluators"
    cluster: cluster_regulatory
    domains: [governance, technical]
    kind: ForesightInstitute
    vsm_system: S4_Intelligence
    vsm_recursion_level: Level_n_plus_1_Jurisdiction
    jurisdiction: Multi_Jurisdictional
    eu_ai_act_role: Not_Applicable
    nist_function: MEASURE
    cardinality_log10_min: 1.0
    cardinality_log10_max: 1.5
    cardinality_unit: entities
    properties:
      red_team_role: "Pre-deployment red-teaming, biosecurity/cyber capability evaluations, systemic risk thresholds"
      vsm_role: "Macro System 4 horizon scanning feeding statutory policy"

  - id: N_AUDITOR
    label: "Conformity Body & ISO Auditor"
    sublabel: "Notified Bodies, ISO/IEC 42001 Certifiers"
    cluster: cluster_regulatory
    domains: [governance]
    kind: StatutoryAuthority
    vsm_system: S3_Star_Audit
    vsm_recursion_level: Level_n_plus_1_Jurisdiction
    jurisdiction: Multi_Jurisdictional
    eu_ai_act_role: Not_Applicable
    nist_function: MEASURE
    cardinality_log10_min: 2.0
    cardinality_log10_max: 3.0
    cardinality_unit: entities
    properties:
      role: "CE conformity assessments (Art. 43) & continuous surveillance"

  - id: N_INSURER
    label: "AI Risk Underwriter & Insurer"
    sublabel: "Algorithmic Liability & Cyber Risk Carrier"
    cluster: cluster_regulatory
    domains: [economic, governance]
    kind: EconomicEntity
    vsm_system: S3_Control
    vsm_recursion_level: Level_n_plus_1_Jurisdiction
    jurisdiction: Global
    eu_ai_act_role: Not_Applicable
    nist_function: MANAGE
    cardinality_log10_min: 2.0
    cardinality_log10_max: 3.0
    cardinality_unit: entities
    properties:
      underwriting_gate: "Requires verifiable audit trail & human oversight"

  - id: N_CAPITAL
    label: "Capital Markets & Venture Underwriters"
    sublabel: "VC Syndicates, Hyperscaler Equity & Sovereign Wealth"
    cluster: cluster_regulatory
    domains: [economic]
    kind: EconomicEntity
    vsm_system: S5_Policy
    vsm_recursion_level: Level_n_plus_1_Jurisdiction
    jurisdiction: Global
    eu_ai_act_role: Not_Applicable
    nist_function: GOVERN
    cardinality_log10_min: 2.0
    cardinality_log10_max: 3.0
    cardinality_unit: entities
    properties:
      financing_role: "Subsidizes CapEx overhang, silicon leases & nuclear PPAs"

  # ===================================================================
  # Cluster 1: Upstream Foundation, Silicon & Energy Supply
  # ===================================================================
  - id: N_SILICON_CHOKEPOINT
    label: "Leading-Edge Silicon & Lithography"
    sublabel: "ASML (EUV), TSMC (Foundry), Nvidia, HBM Memory"
    cluster: cluster_supply
    domains: [economic, technical]
    kind: EconomicEntity
    vsm_system: S1_Operations
    vsm_recursion_level: Level_n_plus_1_Jurisdiction
    jurisdiction: Global
    eu_ai_act_role: Not_Applicable
    nist_function: MAP
    cardinality_log10_min: 0.0
    cardinality_log10_max: 1.0
    cardinality_unit: entities
    properties:
      geopolitical_exposure: "Concentrated in Taiwan Strait & Netherlands; subject to strict US EAR export controls"
      capex_cycle: "$20B+ per fab; 3-5 year construction lead time"

  - id: N_ENERGY_GRID
    label: "Energy Grids & Power Generation"
    sublabel: "Nuclear PPAs, Substation Transformers, Cooling"
    cluster: cluster_supply
    domains: [economic, technical]
    kind: EconomicEntity
    vsm_system: S1_Operations
    vsm_recursion_level: Level_n_plus_1_Jurisdiction
    jurisdiction: Multi_Jurisdictional
    eu_ai_act_role: Not_Applicable
    nist_function: MAP
    cardinality_log10_min: 2.0
    cardinality_log10_max: 3.0
    cardinality_unit: entities
    properties:
      physical_bottleneck: "Substation transformer lead times of 3-5 years; GW-scale interconnection queues"
      environmental_impact: "Carbon intensity, baseline grid load, cooling water consumption"

  - id: N_TRAIN
    label: "Training Supply Chain & Compute Campuses"
    sublabel: "Mega-Data Centers, Cluster Fabric, Data Curators"
    cluster: cluster_supply
    domains: [economic, technical]
    kind: EconomicEntity
    vsm_system: S1_Operations
    vsm_recursion_level: Level_n_plus_1_Jurisdiction
    jurisdiction: Global
    eu_ai_act_role: Not_Applicable
    nist_function: MAP
    cardinality_log10_min: 1.0
    cardinality_log10_max: 1.3
    cardinality_unit: clusters
    properties:
      compute_profile: "Concentrated 50k-100k+ GPU clusters; GW-scale power"
      cost_type: "Fixed / Heavy CapEx ($600B Infrastructure Question)"

  - id: N_FRONTIER
    label: "Frontier Foundation Model"
    sublabel: "Globally Replicated Weights & Inference Fleets"
    cluster: cluster_supply
    domains: [economic, technical, governance]
    kind: SoftwareService
    vsm_system: S1_Operations
    vsm_recursion_level: Level_n_Enterprise
    jurisdiction: Global
    eu_ai_act_role: Provider_GPAI
    nist_function: MEASURE
    cardinality_log10_min: 1.0
    cardinality_log10_max: 1.3
    cardinality_unit: entities
    properties:
      compute_profile: "High memory-bandwidth inference clusters; low latency"
      liability_posture: "Disclaimed via ToS ('AS-IS')"

  - id: N_OPEN_MODEL
    label: "Open-Weight Model Commons"
    sublabel: "Commoditized Weights, Distilled Checkpoints & Local Runtimes"
    cluster: cluster_supply
    domains: [economic, technical]
    kind: SoftwareService
    vsm_system: S4_Intelligence
    vsm_recursion_level: Level_n_Enterprise
    jurisdiction: Global
    eu_ai_act_role: Provider_GPAI
    nist_function: MAP
    cardinality_log10_min: 2.0
    cardinality_log10_max: 3.0
    cardinality_unit: instances
    properties:
      pricing_model: "Zero Marginal License Cost (Commoditized Inference)"

  - id: N_ABSORBED
    label: "Platform Absorption Zone"
    sublabel: "Native Tools, Prompt Cache, Hosted State"
    cluster: cluster_supply
    domains: [economic, technical]
    kind: EconomicEntity
    vsm_system: ENVIRONMENT
    vsm_recursion_level: Level_n_Enterprise
    jurisdiction: Global
    eu_ai_act_role: Not_Applicable
    nist_function: NOT_APPLICABLE
    cardinality_log10_min: 0.5
    cardinality_log10_max: 0.8
    cardinality_unit: entities
    properties:
      market_effect: "Feature commoditization of wrapper ISVs (a16z Stack)"

  # ===================================================================
  # Cluster 2: Specialized Product & Harness Domain (ISV / Custom)
  # ===================================================================
  - id: N_ISV_PRODUCT
    label: "Specialized AI Application"
    sublabel: "Vertical Solutions (Legal, Medical, Finance, Ops)"
    cluster: cluster_product
    domains: [economic, technical]
    kind: SoftwareService
    vsm_system: S4_Intelligence
    vsm_recursion_level: Level_n_Enterprise
    jurisdiction: Global
    eu_ai_act_role: Provider_System
    nist_function: MAP
    cardinality_log10_min: 4.0
    cardinality_log10_max: 5.0
    cardinality_unit: instances
    properties:
      margin_exposure: "Squeezed between token costs & platform absorption"

  - id: N_HARNESS
    label: "Autonomous Agent Runtime (The Harness)"
    sublabel: "Execution Loop, Planning, Rights & Guardrails"
    cluster: cluster_product
    domains: [technical, governance]
    kind: DeterministicGate
    vsm_system: S3_Control
    vsm_recursion_level: Level_n_Enterprise
    jurisdiction: Global
    eu_ai_act_role: Not_Applicable
    nist_function: MANAGE
    cardinality_log10_min: 7.0
    cardinality_log10_max: 9.0
    cardinality_unit: invocations_per_year
    properties:
      compute_profile: "Lightweight CPU / Orchestration Logic"
      iso_42001_role: "AIMS Technical Control Implementation"

  - id: N_AUDIT_STORE
    label: "Sovereign Audit Ledger"
    sublabel: "Tamper-Evident WORM State & Forensic Store"
    cluster: cluster_product
    domains: [technical, governance]
    kind: StateStore
    vsm_system: S3_Control
    vsm_recursion_level: Level_n_Enterprise
    jurisdiction: Global
    eu_ai_act_role: Not_Applicable
    nist_function: MEASURE
    cardinality_log10_min: 4.0
    cardinality_log10_max: 5.0
    cardinality_unit: instances
    properties:
      compliance: "Art. 12 Mandatory Logging / Rebuttal of Fault"

  - id: N_OBSERVE
    label: "Observability & Evals Engine"
    sublabel: "Continuous Evaluation, Traces & Cost Telemetry"
    cluster: cluster_product
    domains: [technical, governance, economic]
    kind: SoftwareService
    vsm_system: S3_Star_Audit
    vsm_recursion_level: Level_n_Enterprise
    jurisdiction: Global
    eu_ai_act_role: Not_Applicable
    nist_function: MEASURE
    cardinality_log10_min: 4.0
    cardinality_log10_max: 5.0
    cardinality_unit: instances
    properties:
      capabilities: "LLM-as-a-judge, OTEL tracing, token telemetry, independent red-teaming"

  # ===================================================================
  # Cluster 3: Enterprise Deployer & Principal Domain (Level n)
  # ===================================================================
  - id: N_ENTERPRISE
    label: "Enterprise Deployer"
    sublabel: "Legal Principal & Economic Sponsor"
    cluster: cluster_client
    domains: [economic, governance]
    kind: EconomicEntity
    vsm_system: S5_Policy
    vsm_recursion_level: Level_n_Enterprise
    jurisdiction: Multi_Jurisdictional
    eu_ai_act_role: Deployer
    nist_function: GOVERN
    cardinality_log10_min: 5.0
    cardinality_log10_max: 6.0
    cardinality_unit: entities
    properties:
      liability_posture: "Holds Vicarious & Strict Legal Liability"

  - id: N_IDP
    label: "Enterprise Identity & Auth (IdP)"
    sublabel: "OAuth, OIDC, Workload IAM & Ephemeral Tokens"
    cluster: cluster_client
    domains: [technical, governance]
    kind: SecurityAuthority
    vsm_system: S2_Coordination
    vsm_recursion_level: Level_n_Enterprise
    jurisdiction: Global
    eu_ai_act_role: Not_Applicable
    nist_function: MANAGE
    cardinality_log10_min: 5.0
    cardinality_log10_max: 6.0
    cardinality_unit: instances
    properties:
      security_role: "Issues scoped actor delegations to agents (A2E)"

  - id: N_KNOWLEDGE_STORE
    label: "Enterprise Semantic Knowledge Base"
    sublabel: "Proprietary Vector DBs, Documents & Embeddings"
    cluster: cluster_client
    domains: [technical, governance]
    kind: StateStore
    vsm_system: S1_Operations
    vsm_recursion_level: Level_n_Enterprise
    jurisdiction: Global
    eu_ai_act_role: Not_Applicable
    nist_function: MAP
    cardinality_log10_min: 5.0
    cardinality_log10_max: 6.0
    cardinality_unit: instances
    properties:
      coala_memory_type: "Semantic Memory (Factual & Document Knowledge)"

  - id: N_HUMAN_USER
    label: "Human Task Delegator & Overseer"
    sublabel: "End User / Mandatory HITL Supervisor"
    cluster: cluster_client
    domains: [technical, governance]
    kind: NaturalPerson
    vsm_system: S5_Policy
    vsm_recursion_level: Level_n_Enterprise
    jurisdiction: Global
    eu_ai_act_role: Deployer
    nist_function: GOVERN
    cardinality_log10_min: 7.0
    cardinality_log10_max: 8.5
    cardinality_unit: natural_persons
    properties:
      control_mode: "Prompting, Art. 14 Human Oversight, Override"

  # ===================================================================
  # Cluster 4: Target Execution Environment & Blast Radius
  # ===================================================================
  - id: N_TOOL_GATEWAY
    label: "Capability & Tool Gateway"
    sublabel: "Decoupled Tool Broker & Context Provider (MCP)"
    cluster: cluster_environment
    domains: [technical, governance]
    kind: DeterministicGate
    vsm_system: S2_Coordination
    vsm_recursion_level: Level_n_Enterprise
    jurisdiction: Global
    eu_ai_act_role: Not_Applicable
    nist_function: MANAGE
    cardinality_log10_min: 4.0
    cardinality_log10_max: 5.0
    cardinality_unit: instances
    properties:
      security_role: "Tool discovery, sandbox isolation, scope negotiation"

  - id: N_TARGET_SYS
    label: "Target Systems & Operational APIs"
    sublabel: "Databases, Production ERP, Financial Rails"
    cluster: cluster_environment
    domains: [technical, governance]
    kind: StateStore
    vsm_system: S1_Operations
    vsm_recursion_level: Level_n_Enterprise
    jurisdiction: Global
    eu_ai_act_role: Not_Applicable
    nist_function: MANAGE
    cardinality_log10_min: 6.0
    cardinality_log10_max: 7.0
    cardinality_unit: instances
    properties:
      risk_zone: "Direct Causation Blast Radius"

  - id: N_AFFECTED_PARTY
    label: "Impacted Third Party"
    sublabel: "Consumers, Employees, Citizens"
    cluster: cluster_environment
    domains: [governance]
    kind: NaturalPerson
    vsm_system: ENVIRONMENT
    vsm_recursion_level: Level_n_plus_1_Jurisdiction
    jurisdiction: Global
    eu_ai_act_role: Affected_Subject
    nist_function: NOT_APPLICABLE
    cardinality_log10_min: 9.0
    cardinality_log10_max: 10.0
    cardinality_unit: natural_persons
    properties:
      legal_standing: "Private Right of Action, Tort Plaintiff, Data Subject"

# ===================================================================
# Relationships & Edges
# ===================================================================
edges:
  # ==========================================
  # 0. Physical Silicon & Energy Supply Edges
  # ==========================================
  - id: E_CAPITAL_TO_SILICON
    from: N_CAPITAL
    to: N_SILICON_CHOKEPOINT
    label: "$$$ Fab CapEx & Lithography Tool Procurement"
    domains: [economic]
    relation_kind: commercial_flow
    protocol_plane: NONE
    polarity: positive
    power_asymmetry: supplier_dominant
    switching_cost: prohibitive

  - id: E_CAPITAL_TO_ENERGY
    from: N_CAPITAL
    to: N_ENERGY_GRID
    label: "$$$ Clean Energy PPAs & Grid Upgrades"
    domains: [economic]
    relation_kind: commercial_flow
    protocol_plane: NONE
    polarity: positive
    power_asymmetry: supplier_dominant
    switching_cost: prohibitive

  - id: E_REG_TO_SILICON_EXPORT
    from: N_REGULATOR
    to: N_SILICON_CHOKEPOINT
    label: "Export Controls, Entity List & Technology Sanctions"
    domains: [governance]
    relation_kind: statutory_mandate
    protocol_plane: NONE
    polarity: negative

  - id: E_SILICON_TO_TRAIN_ALLOCATION
    from: N_SILICON_CHOKEPOINT
    to: N_TRAIN
    label: "Leading-Edge GPU Allocation & Advanced Packaging (CoWoS)"
    domains: [economic, technical]
    relation_kind: data_flow
    protocol_plane: NONE
    polarity: positive
    power_asymmetry: supplier_dominant
    switching_cost: prohibitive

  - id: E_ENERGY_TO_TRAIN_CONSTRAINT
    from: N_ENERGY_GRID
    to: N_TRAIN
    label: "Physical GW Power & Transformer Bottleneck"
    domains: [economic, technical]
    relation_kind: liability_exposure
    protocol_plane: NONE
    polarity: negative

  # ==========================================
  # 1. Standards & Macro Foresight Edges
  # ==========================================
  - id: E_SAFETY_TO_REG_INTELLIGENCE
    from: N_SAFETY_INSTITUTE
    to: N_REGULATOR
    label: "Pre-Deployment Evaluations & Systemic Risk Alerts (Macro S4 to S5)"
    domains: [governance]
    relation_kind: governance_control
    protocol_plane: NONE
    polarity: positive

  - id: E_STANDARDS_TO_AUDITOR_BENCHMARK
    from: N_STANDARDS_BODY
    to: N_AUDITOR
    label: "Harmonized Standards & Audit Specifications (ISO 42001 / CEN)"
    domains: [governance, technical]
    relation_kind: governance_control
    protocol_plane: NONE
    polarity: positive

  - id: E_STANDARDS_TO_HARNESS_SPEC
    from: N_STANDARDS_BODY
    to: N_HARNESS
    label: "Technical Control Standards & Interoperability Profiles"
    domains: [technical, governance]
    relation_kind: governance_control
    protocol_plane: NONE
    polarity: positive

  - id: E_FRONTIER_TO_SAFETY_EVAL
    from: N_FRONTIER
    to: N_SAFETY_INSTITUTE
    label: "Pre-Release Model Weight Access for National Security Red-Teaming"
    domains: [governance, technical]
    relation_kind: data_flow
    protocol_plane: NONE
    polarity: positive

  # ==========================================
  # 2. Economic & Capital Flows
  # ==========================================
  - id: E_CAPITAL_TO_FRONTIER
    from: N_CAPITAL
    to: N_FRONTIER
    label: "$$$ Equity Subsidies & Compute Credits"
    domains: [economic]
    relation_kind: commercial_flow
    protocol_plane: NONE
    polarity: positive
    power_asymmetry: supplier_dominant
    switching_cost: high

  - id: E_CAPITAL_TO_TRAIN
    from: N_CAPITAL
    to: N_TRAIN
    label: "$$$ CapEx Infrastructure Project Debt & Equity"
    domains: [economic]
    relation_kind: commercial_flow
    protocol_plane: NONE
    polarity: positive
    power_asymmetry: balanced
    switching_cost: high

  - id: E_ENT_TO_ISV_SUB
    from: N_ENTERPRISE
    to: N_ISV_PRODUCT
    label: "$$$ SaaS Subscription / Outcome Fee"
    domains: [economic]
    relation_kind: commercial_flow
    protocol_plane: NONE
    polarity: positive
    power_asymmetry: balanced
    switching_cost: moderate

  - id: E_ISV_TO_FRONTIER_TOKEN
    from: N_ISV_PRODUCT
    to: N_FRONTIER
    label: "$$ Wholesale Token Consumption Cost"
    domains: [economic]
    relation_kind: commercial_flow
    protocol_plane: NONE
    polarity: positive
    power_asymmetry: supplier_dominant
    switching_cost: high

  - id: E_FRONTIER_TO_TRAIN_CAPEX
    from: N_FRONTIER
    to: N_TRAIN
    label: "$ Compute CapEx & Annotation"
    domains: [economic]
    relation_kind: commercial_flow
    protocol_plane: NONE
    polarity: positive
    power_asymmetry: balanced
    switching_cost: high

  - id: E_ENT_TO_INSURER_PREMIUM
    from: N_ENTERPRISE
    to: N_INSURER
    label: "$ Policy Premiums & Risk Transfer"
    domains: [economic, governance]
    relation_kind: commercial_flow
    protocol_plane: NONE
    polarity: negative
    power_asymmetry: balanced
    switching_cost: moderate

  - id: E_ABSORBED_TENSION_ISV
    from: N_ABSORBED
    to: N_ISV_PRODUCT
    label: "Platform Commoditization Pressure (a16z Stack)"
    domains: [economic]
    relation_kind: liability_exposure
    protocol_plane: NONE
    polarity: negative
    power_asymmetry: captive
    switching_cost: prohibitive

  - id: E_TRAIN_TO_OPEN_MODEL
    from: N_TRAIN
    to: N_OPEN_MODEL
    label: "Sunk-Cost Open Weights Release"
    domains: [economic, technical]
    relation_kind: data_flow
    protocol_plane: NONE
    polarity: positive

  - id: E_OPEN_DEFLATION_FRONTIER
    from: N_OPEN_MODEL
    to: N_FRONTIER
    label: "Inference Price Deflation & Compression"
    domains: [economic]
    relation_kind: liability_exposure
    protocol_plane: NONE
    polarity: negative

  # ==========================================
  # 3. Governance, Regulatory & Liability Edges
  # ==========================================
  - id: E_REG_TO_ENT_COMPLIANCE
    from: N_REGULATOR
    to: N_ENTERPRISE
    label: "Statutory Penalties & Enforcement (Art. 99)"
    domains: [governance]
    relation_kind: statutory_mandate
    protocol_plane: NONE
    polarity: negative

  - id: E_REG_TO_FRONTIER_GPAI
    from: N_REGULATOR
    to: N_FRONTIER
    label: "GPAI Codes of Practice & Transparency (Art. 53/101)"
    domains: [governance]
    relation_kind: statutory_mandate
    protocol_plane: NONE
    polarity: negative

  - id: E_REG_TO_ISV_HIGH_RISK
    from: N_REGULATOR
    to: N_ISV_PRODUCT
    label: "High-Risk System Compliance & Surveillance (Art. 9/43)"
    domains: [governance]
    relation_kind: statutory_mandate
    protocol_plane: NONE
    polarity: negative

  - id: E_AUDITOR_TO_ENT
    from: N_AUDITOR
    to: N_ENTERPRISE
    label: "Conformity Audits (ISO 42001 / High Risk)"
    domains: [governance]
    relation_kind: statutory_mandate
    protocol_plane: NONE
    polarity: negative

  - id: E_FRONTIER_DISCLAIM_ENT
    from: N_FRONTIER
    to: N_ENTERPRISE
    label: "Disclaims Liability (ToS 'AS-IS' / Recourse Gap)"
    domains: [governance]
    relation_kind: contractual_term
    protocol_plane: NONE
    polarity: negative

  - id: E_ENT_VICARIOUS_AFFECTED
    from: N_ENTERPRISE
    to: N_AFFECTED_PARTY
    label: "Vicarious Liability for Harm (Respondeat Superior)"
    domains: [governance]
    relation_kind: liability_exposure
    protocol_plane: NONE
    polarity: negative

  - id: E_AFFECTED_TO_REG_COMPLAINT
    from: N_AFFECTED_PARTY
    to: N_REGULATOR
    label: "Complaints & Redress Demands (Art. 85)"
    domains: [governance]
    relation_kind: data_flow
    protocol_plane: NONE
    polarity: positive

  - id: E_ENT_TO_HARNESS_DELEGATION
