name: Deploy Ecosystem Documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # PHASE 1: Python Environment Setup
      # ------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python YAML Parser
        run: pip install pyyaml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml linkml


      # ------------------------------------------------------------------
      # PHASE 2: Run Exporters in Sequence
      # ------------------------------------------------------------------
      - name: "Phase 2A: Generate yEd GraphML Exports"
        run: python scripts/export_yed.py

      - name: "Phase 2B: Generate draw.io XML Exports"
        run: python scripts/export_drawio.py

      - name: "Phase 2C: Generate Docusaurus Markdown & Mermaid Views"
        run: python scripts/generate_docs.py

      # ------------------------------------------------------------------
      # PHASE 3: Node & Docusaurus Compilation
      # ------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Static Docusaurus Site
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4