id: https://w3id.org/ai-ecosystem/schema
name: ai_ecosystem_schema
title: AI Ecosystem Metamodel Specification
description: Formal schema defining nodes, edges, clusters, regulatory roles, cybernetic systems, and protocol planes.
version: "2.2.0"

prefixes:
  linkml: https://w3id.org/linkml/
  aieco: https://w3id.org/ai-ecosystem/
  skos: http://www.w3.org/2004/02/skos/core#
  prov: http://www.w3.org/ns/prov#

imports:
  - linkml:types

default_range: string
default_prefix: aieco

# ===================================================================
# CLASSES
# ===================================================================
classes:
  EcosystemModel:
    tree_root: true
    slots:
      - metadata
      - styles
      - taxonomies
      - clusters
      - nodes
      - edges
      - views

  Metadata:
    description: "Model-level provenance and descriptive headers."
    slots:
      - title
      - version
      - description

  Cluster:
    description: "Functional or value-chain boundary."
    slots:
      - id
      - label
      - description

  Node:
    description: "Architectural archetype (system, authority, actor, or asset)."
    slots:
      - id
      - label
      - sublabel
      - cluster
      - domains
      - kind
      - vsm_system
      - vsm_recursion_level
      - jurisdiction
      - eu_ai_act_role
      - nist_function
      - cardinality_log10_min
      - cardinality_log10_max
      - cardinality_unit
      - properties
    slot_usage:
      cluster:
        range: Cluster
        required: true
      domains:
        range: DomainEnum
        multivalued: true
        required: true
      kind:
        range: NodeKindEnum
        required: true
      vsm_system:
        range: VSMSystemEnum
        required: true
      vsm_recursion_level:
        range: VSMRecursionLevelEnum
        required: true
      jurisdiction:
        range: JurisdictionEnum
        required: false
      eu_ai_act_role:
        range: EuAiActRoleEnum
        required: false
      nist_function:
        range: NistRmfFunctionEnum
        required: false
      cardinality_log10_min:
        range: float
        required: true
      cardinality_log10_max:
        range: float
        required: true
      cardinality_unit:
        range: CardinalityUnitEnum
        required: true

  Edge:
    description: "Directed relationship, financial flow, protocol call, or liability boundary."
    slots:
      - id
      - from_node
      - to_node
      - label
      - domains
      - relation_kind
      - protocol_plane
      - polarity
      - power_asymmetry
      - switching_cost
    slot_usage:
      id:
        required: true
      from_node:
        range: Node
        required: true
      to_node:
        range: Node
        required: true
      domains:
        range: DomainEnum
        multivalued: true
        required: true
      relation_kind:
        range: RelationKindEnum
        required: true
      protocol_plane:
        range: ProtocolPlaneEnum
        required: true
      polarity:
        range: PolarityEnum
        required: true
      power_asymmetry:
        range: PowerAsymmetryEnum
        required: false
      switching_cost:
        range: SwitchingCostEnum
        required: false

  View:
    description: "Queryable lens projecting a slice of the property graph."
    slots:
      - id
      - title
      - description
      - domains
      - direction
    slot_usage:
      domains:
        range: DomainEnum
        multivalued: true
        required: true
      direction:
        range: DirectionEnum

  AnyObject:
    class_uri: linkml:Any
    description: "Unconstrained dictionary for dynamic node properties."

# ===================================================================
# SLOTS
# ===================================================================
slots:
  id:
    identifier: true
    range: string
  title:
    range: string
  label:
    range: string
  sublabel:
    range: string
  version:
    range: string
  description:
    range: string
  from_node:
    alias: from
    range: Node
  to_node:
    alias: to
    range: Node
  cluster:
    range: Cluster
  direction:
    range: DirectionEnum
  kind:
    range: NodeKindEnum
  vsm_system:
    range: VSMSystemEnum
  vsm_recursion_level:
    range: VSMRecursionLevelEnum
  jurisdiction:
    range: JurisdictionEnum
  eu_ai_act_role:
    range: EuAiActRoleEnum
  nist_function:
    range: NistRmfFunctionEnum
  cardinality_log10_min:
    range: float
  cardinality_log10_max:
    range: float
  cardinality_unit:
    range: CardinalityUnitEnum
  relation_kind:
    range: RelationKindEnum
  protocol_plane:
    range: ProtocolPlaneEnum
  polarity:
    range: PolarityEnum
  power_asymmetry:
    range: PowerAsymmetryEnum
  switching_cost:
    range: SwitchingCostEnum
  metadata:
    range: Metadata
    inlined: true
  styles:
    range: AnyObject
    inlined: true
  taxonomies:
    range: AnyObject
    inlined: true
  properties:
    range: AnyObject
    inlined: true
  domains:
    range: DomainEnum
    multivalued: true
  clusters:
    range: Cluster
    multivalued: true
    inlined_as_list: true
  nodes:
    range: Node
    multivalued: true
    inlined_as_list: true
  edges:
    range: Edge
    multivalued: true
    inlined_as_list: true
  views:
    range: View
    multivalued: true
    inlined_as_list: true

# ===================================================================
# ENUMS
# ===================================================================
enums:
  DomainEnum:
    permissible_values:
      economic: {}
      technical: {}
      governance: {}

  NodeKindEnum:
    permissible_values:
      StatutoryAuthority:
        description: "Regulators, court systems, market surveillance."
      StandardsConsortium:
        description: "International standards setting organizations, technical committees (ISO/IEC JTC 1/SC 42, IEEE, W3C, CEN-CENELEC)."
      ForesightInstitute:
        description: "National AI Safety Institutes (US/UK/Japan AISI), frontier red-team evaluators, horizon-scanning bodies."
      NaturalPerson:
        description: "Human delegators, operators, impacted citizens."
      DeterministicGate:
        description: "Policy kernels, sandboxes, capability brokers."
      StateStore:
        description: "Vector databases, audit ledgers, ERP systems."
      SecurityAuthority:
        description: "IdP, OAuth token brokers, workload IAM."
      SoftwareService:
        description: "Foundation model endpoints, vertical SaaS."
      EconomicEntity:
        description: "Commercial deployers, compute hubs, insurers, utility operators."

  VSMSystemEnum:
    permissible_values:
      S1_Operations:
        description: "System 1: Operational primary activities."
      S2_Coordination:
        description: "System 2: Oscillation damping and protocol arbitration."
      S3_Control:
        description: "System 3: Operational control and internal stability."
      S3_Star_Audit:
        description: "System 3*: Sporadic, independent audit and red-teaming."
      S4_Intelligence:
        description: "System 4: Environmental scanning, foresight, and horizon strategy."
      S5_Policy:
        description: "System 5: Ultimate policy and identity closure."
      ENVIRONMENT:
        description: "External operational environment and blast radius."

  VSMRecursionLevelEnum:
    permissible_values:
      Level_n_Enterprise:
        description: "Recursion Level n: The enterprise deployer and its internal AI operations."
      Level_n_plus_1_Jurisdiction:
        description: "Recursion Level n+1: The societal, statutory, and macro-financial meta-system."
      Level_n_minus_1_Component:
        description: "Recursion Level n-1: Internal micro-components within an agent runtime."

  JurisdictionEnum:
    permissible_values:
      Global:
        description: "Transnational / global consensus or market space"
      EU:
        description: "European Union legal framework"
      US:
        description: "United States federal and state jurisdictions"
      UK:
        description: "United Kingdom regulatory framework"
      APAC:
        description: "Asia-Pacific legal frameworks (Australia, Singapore, Japan)"
      Multi_Jurisdictional:
        description: "Cross-border operational footprint"

  CardinalityUnitEnum:
    permissible_values:
      jurisdictions:
        description: "Independent sovereign legal jurisdictions"
      entities:
        description: "Incorporated organizations, firms, or labs"
      clusters:
        description: "Physical mega-compute data center clusters"
      instances:
        description: "Deployed persistent application instances or gateways"
      invocations_per_year:
        description: "Annual ephemeral agent execution loops"
      natural_persons:
        description: "Individual human beings"

  EuAiActRoleEnum:
    permissible_values:
      Provider_GPAI: {}
      Provider_System: {}
      Deployer: {}
      Importer: {}
      Distributor: {}
      Affected_Subject: {}
      Not_Applicable: {}

  NistRmfFunctionEnum:
    permissible_values:
      GOVERN: {}
      MAP: {}
      MEASURE: {}
      MANAGE: {}
      NOT_APPLICABLE: {}

  RelationKindEnum:
    permissible_values:
      commercial_flow:
        description: "Capital, subscription fees, CapEx."
      statutory_mandate:
        description: "Legal authority, compliance orders, fines."
      governance_control:
        description: "Policy bounds, scope enforcement, human override."
      liability_exposure:
        description: "Tort liability, blast radius, recourse."
      contractual_term:
        description: "ToS liability disclaimers, SLAs."
      protocol_call:
        description: "Authenticated technical protocols (MIP, A2E, A2T, A2A)."
      data_flow:
        description: "Telemetry, prompts, audit logs."
      algedonic_signal:
        description: "Emergency bypass alarm signaling critical failure from S1 to S5."

  ProtocolPlaneEnum:
    permissible_values:
      A2E:
        description: "Agent-to-Enterprise Identity & Auth"
      MIP:
        description: "Model Inference Protocol"
      A2T:
        description: "Agent-to-Tool Context (MCP, OpenAPI)"
      A2A:
        description: "Agent-to-Agent Peer Protocols"
      NONE:
        description: "Non-technical institutional relationship"

  PolarityEnum:
    permissible_values:
      positive:
        description: "Reinforcing edge: increases state of target."
      negative:
        description: "Dampening edge: bounds or drains state of target."
      neutral:
        description: "Transactional or state transfer without dynamic sign."

  PowerAsymmetryEnum:
    permissible_values:
      supplier_dominant:
        description: "Supplier dictates terms, access, and pricing (seller's market)."
      buyer_dominant:
        description: "Buyer dictates terms and performance specifications (buyer's market)."
      balanced:
        description: "Bilateral bargaining parity between commercial parties."
      captive:
        description: "Target is structurally captive with near-zero alternative suppliers."

  SwitchingCostEnum:
    permissible_values:
      prohibitive:
        description: "Switching involves complete architectural, physical, or legal refactoring."
      high:
        description: "Switching requires significant data migration, re-indexing, or prompt re-tuning."
      moderate:
        description: "Standard multi-cloud or modular API adaptation effort."
      low:
        description: "Commoditized drop-in replacement (e.g. OpenAI-compatible endpoints)."

  DirectionEnum:
    permissible_values:
      TB: {}
      LR: {}
      BT: {}
      RL: {}